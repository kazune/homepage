<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#365945" />
    <meta name="description" content="名前とURLをまとめて、ひとつのリンクで共有。" />
    <title>共有ブックマーク</title>
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <main>
      <header class="page-header">
        <a class="back" href="../">← アプリ一覧</a>
        <p class="eyebrow">BOOKMARK LIST</p>
        <h1 id="page-title">共有ブックマーク</h1>
        <p id="intro" class="intro">リンクをまとめて、ひとつのURLで。</p>
        <p id="message" role="status" aria-live="polite"></p>
      </header>

      <p id="load-error" class="error" role="alert" hidden></p>

      <section id="viewer" aria-labelledby="page-title" hidden>
        <div class="view-toolbar">
          <p id="link-count"></p>
          <div class="actions">
            <button id="new-list" type="button" aria-label="新しいリストを作る"><span class="button-label-long" aria-hidden="true">＋ 新しいリストを作る</span><span class="button-label-short" aria-hidden="true">新規</span></button>
            <button id="edit" type="button">編集</button>
            <button id="copy" type="button" class="primary" aria-label="共有リンクをコピー"><span class="button-label-long" aria-hidden="true">共有リンクをコピー</span><span class="button-label-short" aria-hidden="true">共有</span></button>
          </div>
        </div>
        <ul id="bookmark-list" class="bookmarks"></ul>
        <time id="updated-at" class="updated-at"></time>
        <div id="copy-fallback" class="fallback" hidden>
          <label for="share-url">共有リンク（選択してコピーしてください）</label>
          <input id="share-url" type="text" readonly />
        </div>
      </section>

      <section id="editor" aria-labelledby="editor-title">
        <h2 id="editor-title">ブックマークを作る</h2>
        <form id="bookmark-form" autocomplete="off">
          <label for="list-title">一覧のタイトル</label>
          <input id="list-title" name="list-title" type="text" autocomplete="off" placeholder="例：通勤で見るページ" required />
          <div class="section-heading"><h3>リンク</h3></div>
          <div id="rows"></div>
          <button id="add" type="button">＋ リンクを追加</button>
          <fieldset class="save-format">
            <legend>保存形式</legend>
            <label><input type="radio" name="save-format" value="v1" /> v1</label>
            <label><input type="radio" name="save-format" value="v2" /> v2</label>
            <label><input type="radio" name="save-format" value="auto" checked /> 自動（デフォルト）</label>
            <p>v1：非圧縮 ／ v2：gzip圧縮。自動は共有URLが短くなる方を選びます。</p>
          </fieldset>
          <p id="form-error" class="error" role="alert"></p>
          <div class="form-actions">
            <button id="cancel" type="button" hidden>キャンセル</button>
            <button id="save" type="submit" class="primary">保存して一覧を表示</button>
          </div>
        </form>
      </section>

      <footer>一覧の情報はURLに保存されます。このページをブックマークして、いつでも開けます。</footer>
    </main>
    <template id="row-template">
      <fieldset class="link-row">
        <legend>リンク</legend>
        <label>リンクのタイトル<input name="link-title" type="text" autocomplete="off" placeholder="例：天気予報" required /></label>
        <label>URL<input name="link-url" type="url" placeholder="https://…" inputmode="url" autocomplete="off" spellcheck="false" required /></label>
        <button type="button" class="remove">削除</button>
      </fieldset>
    </template>
    <noscript>このアプリを使うにはJavaScriptを有効にしてください。</noscript>
    <script type="module" src="./assets/main.js"></script>
  </body>
</html>
