<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Back Workout</title>
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <main class="page">
      <section class="tracker" aria-labelledby="appTitle">
        <header class="topbar">
          <div>
            <p class="date" data-today></p>
            <h1 id="appTitle">今日の背中メニュー</h1>
          </div>
          <span class="state" data-state>未記録</span>
        </header>

        <form data-form>
          <fieldset class="section">
            <legend>メニュー</legend>
            <div class="menu-list" data-menu-list></div>
          </fieldset>

          <fieldset class="section">
            <legend>腰の状態</legend>
            <div class="pain-options">
              <label>
                <input type="radio" name="pain" value="none" checked />
                <span>問題なし</span>
              </label>
              <label>
                <input type="radio" name="pain" value="mild" />
                <span>少し違和感</span>
              </label>
              <label>
                <input type="radio" name="pain" value="bad" />
                <span>痛い</span>
              </label>
            </div>
          </fieldset>

          <button type="submit" class="primary-action">記録する</button>
          <p class="message" data-message aria-live="polite"></p>
        </form>

        <section class="history-section" aria-labelledby="historyTitle">
          <h2 id="historyTitle">過去7日</h2>
          <ol class="history" data-history></ol>
        </section>
      </section>
    </main>

    <script src="./assets/main.js"></script>
  </body>
</html>
