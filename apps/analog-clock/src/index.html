<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Analog Clock</title>
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <main class="page">
      <h1>Analog Clock</h1>
      <div class="clock" aria-label="Analog clock">
        <div class="marker marker-12">12</div>
        <div class="marker marker-3">3</div>
        <div class="marker marker-6">6</div>
        <div class="marker marker-9">9</div>

        <div class="hand hour" data-hand="hour"></div>
        <div class="hand minute" data-hand="minute"></div>
        <div class="hand second" data-hand="second"></div>
        <div class="center-dot"></div>
      </div>
    </main>

    <script src="./assets/main.js"></script>
  </body>
</html>
