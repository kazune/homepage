<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Password Generator</title>
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <main class="page">
      <section class="tool" aria-labelledby="appTitle">
        <div class="header">
          <div>
            <h1 id="appTitle">Password Generator</h1>
            <p>ブラウザ内でランダムなパスワードを生成します。</p>
          </div>
          <button type="button" class="primary-action" data-generate>生成</button>
        </div>

        <form class="controls" data-form>
          <label class="field">
            <span>長さ</span>
            <input type="number" min="4" max="128" value="16" data-length />
          </label>

          <label class="field">
            <span>生成数</span>
            <input type="number" min="1" max="20" value="5" data-count />
          </label>

          <fieldset>
            <legend>文字種</legend>
            <label><input type="checkbox" checked data-charset="lower" /> 小文字</label>
            <label><input type="checkbox" checked data-charset="upper" /> 大文字</label>
            <label><input type="checkbox" checked data-charset="number" /> 数字</label>
            <label><input type="checkbox" checked data-charset="symbol" /> 記号</label>
          </fieldset>

          <label class="check">
            <input type="checkbox" checked data-exclude-ambiguous />
            <span>紛らわしい文字を除外する</span>
          </label>
        </form>

        <p class="message" data-message aria-live="polite">
          生成されたパスワードは保存されません。
        </p>

        <div class="results" data-results aria-live="polite"></div>
      </section>
    </main>

    <script src="./assets/main.js"></script>
  </body>
</html>
