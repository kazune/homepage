---
openapi: 3.1.0
info:
  title: Learn REST Users API
  version: 1.0.0
  description: Learn RESTのブラウザ内シミュレーターが実装する仮想API
servers:
  - url: https://learn-rest.invalid
    description: 説明用の仮想サーバー。実際の通信先ではありません。
paths:
  /users:
    get:
      operationId: listUsers
      summary: ユーザー一覧を取得する
      parameters:
        - name: q
          in: query
          description: nameまたはemailに対する部分一致検索
          schema:
            type: string
        - name: sort
          in: query
          description: ソート対象
          schema:
            type: string
            enum: [id, name, email]
            default: id
        - name: order
          in: query
          description: ソート方向
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: page
          in: query
          description: 1から始まるページ番号
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          description: 1ページの最大件数
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        "200":
          description: ユーザー一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      operationId: createUser
      summary: ユーザーを作成する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: 作成したユーザー
          headers:
            Location:
              description: 作成したリソースのURI
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationError"
  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ユーザーID
        schema:
          type: integer
          minimum: 1
    get:
      operationId: getUser
      summary: ユーザーを取得する
      responses:
        "200":
          description: ユーザー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: replaceUser
      summary: ユーザー全体を置換する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "200":
          description: 置換後のユーザー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    patch:
      operationId: updateUser
      summary: ユーザーを部分更新する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPatch"
      responses:
        "200":
          description: 更新後のユーザー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      operationId: deleteUser
      summary: ユーザーを削除する
      responses:
        "204":
          description: 削除に成功。レスポンスボディはありません。
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  schemas:
    User:
      type: object
      additionalProperties: false
      required: [id, name, email]
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          pattern: "\\S"
        email:
          type: string
          format: email
    UserInput:
      type: object
      additionalProperties: false
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
          pattern: "\\S"
        email:
          type: string
          format: email
    UserPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          pattern: "\\S"
        email:
          type: string
          format: email
    PageMeta:
      type: object
      additionalProperties: false
      required: [page, perPage, total, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    UserList:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
        meta:
          $ref: "#/components/schemas/PageMeta"
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
  responses:
    BadRequest:
      description: クエリパラメータなどが不正
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 対象ユーザーが存在しない
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: JSONは解釈できるが入力値が不正
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
...
