<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Splatoon Weapon Challenge</title>
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <div>
          <p class="eyebrow">Splatoon 3</p>
          <h1>全ブキn勝チャレンジ</h1>
        </div>
        <label class="target-control">
          <span>目標</span>
          <input type="number" min="1" step="1" value="1" data-target-wins />
          <span>勝</span>
        </label>
      </header>

      <section class="summary" aria-label="進捗">
        <div>
          <span class="summary-label">達成</span>
          <strong data-complete-count>0 / 0</strong>
        </div>
        <div>
          <span class="summary-label">達成率</span>
          <strong data-complete-rate>0%</strong>
        </div>
        <div>
          <span class="summary-label">総勝利</span>
          <strong data-total-wins>0</strong>
        </div>
        <div>
          <span class="summary-label">総試合</span>
          <strong data-total-matches>0</strong>
        </div>
      </section>

      <section class="toolbar" aria-label="操作">
        <input type="search" placeholder="ブキ名、サブ、スペシャルで検索" data-search />
        <select data-class-filter aria-label="ブキ種">
          <option value="all">全ブキ種</option>
        </select>
        <select data-status-filter aria-label="状態">
          <option value="incomplete">未達成</option>
          <option value="all">全部</option>
          <option value="complete">達成済み</option>
          <option value="unused">未使用</option>
        </select>
        <button type="button" data-random>ランダム未達成</button>
      </section>

      <section class="picked" data-picked hidden aria-live="polite">
        <span>次のブキ</span>
        <strong data-picked-name></strong>
      </section>

      <section class="list-shell" aria-label="ブキ一覧">
        <div class="list-head">
          <span data-visible-count>0件</span>
          <span data-message>読み込み中</span>
        </div>
        <div class="weapon-list" data-list></div>
      </section>

      <section class="backup" aria-label="バックアップ">
        <button type="button" data-export>進捗をコピー</button>
        <label class="import-button">
          進捗を読み込み
          <input type="file" accept="application/json,.json" data-import />
        </label>
        <button type="button" class="danger" data-reset>全リセット</button>
      </section>
    </main>

    <script src="./assets/main.js"></script>
  </body>
</html>
