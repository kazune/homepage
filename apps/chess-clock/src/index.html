<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#111827" />
    <title>Chess Clock</title>
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <main class="clock" data-clock>
      <button class="player player-top" type="button" data-player="1" aria-label="プレイヤー2の時計">
        <span class="player-content">
          <span class="player-name">PLAYER 2</span>
          <span class="time" data-time="1">05:00</span>
          <span class="turn" data-turn="1"></span>
        </span>
      </button>

      <section class="controls" aria-label="時計の操作">
        <button type="button" class="icon-button" data-action="pause" aria-label="一時停止" title="一時停止" disabled>
          <svg data-pause-icon viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 5h3v14H7zm7 0h3v14h-3z" />
          </svg>
          <svg class="d-none" data-resume-icon viewBox="0 0 24 24" aria-hidden="true">
            <path d="m8 5 11 7-11 7z" />
          </svg>
        </button>
        <p class="status" data-status>時計をタップして開始</p>
        <button type="button" class="icon-button" data-action="settings" aria-label="設定" title="設定">
          <svg class="stroke-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" />
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21h-4v-.08A1.7 1.7 0 0 0 8.94 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.57 15 1.7 1.7 0 0 0 3 14H3v-4h.08A1.7 1.7 0 0 0 4.6 8.94a1.7 1.7 0 0 0-.34-1.88L4.2 7l2.83-2.83.06.06a1.7 1.7 0 0 0 1.88.34A1.7 1.7 0 0 0 10 3.08V3h4v.08a1.7 1.7 0 0 0 1.06 1.52 1.7 1.7 0 0 0 1.88-.34L17 4.2 19.83 7l-.06.06a1.7 1.7 0 0 0-.34 1.88A1.7 1.7 0 0 0 20.92 10H21v4h-.08A1.7 1.7 0 0 0 19.4 15Z" />
          </svg>
        </button>
        <button type="button" class="icon-button" data-action="reset" aria-label="リセット" title="リセット">
          <svg class="stroke-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
            <path d="M3 3v5h5" />
          </svg>
        </button>
      </section>

      <button class="player player-bottom" type="button" data-player="0" aria-label="プレイヤー1の時計">
        <span class="player-content">
          <span class="player-name">PLAYER 1</span>
          <span class="time" data-time="0">05:00</span>
          <span class="turn" data-turn="0"></span>
        </span>
      </button>
    </main>

    <section class="settings-page d-none" data-settings aria-labelledby="settings-title">
      <form data-settings-form>
        <h1 id="settings-title">時計の設定</h1>
        <label class="check"><input name="separate" type="checkbox" data-separate /> 異なる設定をする</label>

        <section class="player-settings" data-settings-player="shared">
          <h2>共通設定</h2>
          <label>持ち時間
            <span class="input-row"><input name="shared-minutes" type="number" min="0" max="180" value="5" inputmode="numeric" required /> 分
            <input name="shared-seconds" type="number" min="0" max="59" value="0" inputmode="numeric" required /> 秒</span>
          </label>
          <fieldset>
            <legend>方式</legend>
            <label class="radio"><input type="radio" name="shared-mode" value="fischer" checked /> フィッシャー</label>
            <label class="radio"><input type="radio" name="shared-mode" value="byoyomi" /> 秒読み</label>
          </fieldset>
          <label data-fischer>着手ごとの加算
            <span class="input-row"><input name="shared-increment" type="number" min="0" max="300" value="3" inputmode="numeric" required /> 秒</span>
          </label>
          <label data-byoyomi hidden>持ち時間終了後の秒読み
            <span class="input-row"><input name="shared-byoyomi" type="number" min="0" max="300" value="10" inputmode="numeric" required /> 秒</span>
            <small>0秒ならサドンデスです</small>
          </label>
        </section>

        <div class="separate-settings d-none" data-separate-settings>
          <section class="player-settings" data-settings-player="0">
            <h2>PLAYER 1</h2>
            <label>持ち時間
              <span class="input-row"><input name="p1-minutes" type="number" min="0" max="180" value="5" inputmode="numeric" required /> 分
              <input name="p1-seconds" type="number" min="0" max="59" value="0" inputmode="numeric" required /> 秒</span>
            </label>
            <fieldset>
              <legend>方式</legend>
              <label class="radio"><input type="radio" name="p1-mode" value="fischer" checked /> フィッシャー</label>
              <label class="radio"><input type="radio" name="p1-mode" value="byoyomi" /> 秒読み</label>
            </fieldset>
            <label data-fischer>着手ごとの加算
              <span class="input-row"><input name="p1-increment" type="number" min="0" max="300" value="3" inputmode="numeric" required /> 秒</span>
            </label>
            <label data-byoyomi hidden>持ち時間終了後の秒読み
              <span class="input-row"><input name="p1-byoyomi" type="number" min="0" max="300" value="10" inputmode="numeric" required /> 秒</span>
              <small>0秒ならサドンデスです</small>
            </label>
          </section>

          <section class="player-settings" data-settings-player="1">
            <h2>PLAYER 2</h2>
            <label>持ち時間
              <span class="input-row"><input name="p2-minutes" type="number" min="0" max="180" value="5" inputmode="numeric" required /> 分
              <input name="p2-seconds" type="number" min="0" max="59" value="0" inputmode="numeric" required /> 秒</span>
            </label>
            <fieldset>
              <legend>方式</legend>
              <label class="radio"><input type="radio" name="p2-mode" value="fischer" checked /> フィッシャー</label>
              <label class="radio"><input type="radio" name="p2-mode" value="byoyomi" /> 秒読み</label>
            </fieldset>
            <label data-fischer>着手ごとの加算
              <span class="input-row"><input name="p2-increment" type="number" min="0" max="300" value="3" inputmode="numeric" required /> 秒</span>
            </label>
            <label data-byoyomi hidden>持ち時間終了後の秒読み
              <span class="input-row"><input name="p2-byoyomi" type="number" min="0" max="300" value="10" inputmode="numeric" required /> 秒</span>
              <small>0秒ならサドンデスです</small>
            </label>
          </section>
        </div>
        <menu>
          <button type="button" data-cancel>戻る</button>
          <button type="submit" value="save" class="primary">適用</button>
        </menu>
      </form>
    </section>

    <script src="./assets/main.js"></script>
  </body>
</html>
