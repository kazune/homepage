<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Splatoon Weapon Challenge</title>
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <div>
          <p class="eyebrow">Splatoon 3</p>
          <h1 data-challenge-title>全ブキ1勝チャレンジ</h1>
        </div>
        <div class="target-tools">
          <label class="target-control">
            <span>目標</span>
            <input type="number" min="1" step="1" value="1" data-target-wins />
            <span>勝</span>
          </label>
          <div class="help-menu" data-help>
            <button
              type="button"
              class="help-toggle"
              aria-label="ヘルプ"
              aria-expanded="false"
              aria-controls="helpPopover"
              data-help-toggle
            >
              ?
            </button>
            <div class="help-popover" id="helpPopover" data-help-popover hidden>
              <h2>ヘルプ</h2>
              <p>
                目標は、全ブキで何勝したら達成扱いにするかの設定です。
                変更しても記録済みの勝敗数は消えません。
              </p>
              <h3>ショートカット</h3>
              <dl>
                <div><dt>w / l</dt><dd>勝ち / 負けを追加</dd></div>
                <div><dt>W / L</dt><dd>勝ち / 負けを取り消し</dd></div>
                <div><dt>j / k</dt><dd>表示中リストを上下移動</dd></div>
                <div><dt>n</dt><dd>表示中リストの先頭を選択</dd></div>
                <div><dt>r</dt><dd>未達成ブキをランダム選択</dd></div>
                <div><dt>/</dt><dd>検索欄にフォーカス</dd></div>
                <div><dt>?</dt><dd>ヘルプを開閉</dd></div>
                <div><dt>Esc</dt><dd>フォーカス解除</dd></div>
              </dl>
            </div>
          </div>
        </div>
      </header>

      <section class="summary" aria-label="進捗">
        <div>
          <span class="summary-label">達成</span>
          <strong data-complete-summary>0 / 0 達成</strong>
        </div>
        <div>
          <span class="summary-label">全体成績</span>
          <strong data-record-summary>0勝 0負</strong>
        </div>
      </section>

      <section class="selected-shell" data-selected-shell aria-label="選択中のブキ">
        <div class="selected-empty" data-selected-empty>
          ブキを選択すると詳細と記録ボタンを表示します。
        </div>
        <div class="selected-detail" data-selected-detail hidden>
          <div class="selected-main">
            <span class="status incomplete" data-selected-status>未達成</span>
            <h2 data-selected-name></h2>
          </div>
          <p class="selected-record" data-selected-record>0勝 0負</p>
        </div>
        <div class="selected-actions" data-selected-actions></div>
      </section>

      <section class="toolbar" aria-label="操作">
        <input type="text" placeholder="ブキ名、サブ、スペシャルで検索" data-search />
        <select data-class-filter aria-label="ブキ種">
          <option value="all">全ブキ種</option>
        </select>
        <select data-status-filter aria-label="状態">
          <option value="all">全部</option>
          <option value="incomplete" selected>未達成</option>
          <option value="complete">達成済み</option>
        </select>
        <select data-sort aria-label="並び順">
          <option value="default">デフォルト順</option>
          <option value="wins">勝数順</option>
          <option value="losses">負数順</option>
        </select>
        <button type="button" data-random>ランダム未達成</button>
      </section>

      <section class="list-shell" aria-label="ブキ一覧">
        <div class="list-head">
          <span data-visible-count>0件</span>
          <span data-message>読み込み中</span>
        </div>
        <div class="weapon-list" data-list></div>
      </section>

      <section class="backup" aria-label="バックアップ">
        <button type="button" data-export>進捗を保存</button>
        <label class="import-button">
          進捗を読み込み
          <input type="file" accept="application/json,.json" data-import />
        </label>
        <button type="button" class="danger" data-reset>全リセット</button>
      </section>
    </main>

    <script src="./assets/main.js"></script>
  </body>
</html>
